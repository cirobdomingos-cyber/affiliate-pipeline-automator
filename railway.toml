# Railway deploy configuration.
#
# Single service, single container. Inside the container, supervisord runs:
#   - uvicorn (FastAPI) on 127.0.0.1:8000
#   - streamlit (UI)    on 127.0.0.1:8501
#   - nginx             on $PORT (public)
#
# nginx reverse-proxies /r/*, /bp/*, /health, /docs, /mailerlite/* to
# FastAPI and everything else to Streamlit. See Dockerfile + deploy/ for
# details. This single-service layout is required because Railway's free
# and hobby tiers do not allow sharing a single Volume between two
# services, and the app's DuckDB file is the shared-state anchor.
#
# Attach a Railway Volume to this service at mount path /data. The app
# reads DATA_DIR=/data from environment (set it in Variables) to locate
# the persistent affiliate.duckdb file.
#
# Environment variables set in the Railway dashboard — see .env.example
# for the full list.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
