# Railway deploy configuration.
#
# Both Railway services in this project use the SAME Dockerfile image
# and the SAME start command: `./start.sh`. The script dispatches on
# the `SERVICE_ROLE` env var (set in Railway Variables per-service):
#
#   SERVICE_ROLE=ui    (default) → Streamlit operator dashboard
#                                  healthcheck: /_stcore/health
#   SERVICE_ROLE=api             → uvicorn FastAPI public routes
#                                  (override healthcheckPath to /health
#                                   in the api service's Settings)
#
# Both services share a single Railway Postgres addon via DATABASE_URL
# (Railway injects it automatically when you attach the addon and
# reference it under Variables → Add Reference). When DATABASE_URL is
# set, backend/app/db.py switches from DuckDB to Postgres via its
# adapter. No Volume is needed.
#
# Full step-by-step: see DEPLOY.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./start.sh"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
