# Railway deploy configuration.
#
# Single service, single container, single process: Streamlit. Railway
# probes Streamlit's native /_stcore/health endpoint as the healthcheck.
#
# Attach a Railway Volume to this service at mount path /data. The app
# reads DATA_DIR=/data from environment (set it in Variables) to locate
# the persistent affiliate.duckdb file.
#
# The FastAPI-owned public routes (/r/{slug}, /bp/{slug}, /mailerlite/*)
# are NOT reachable from this deploy — they only work when uvicorn is
# running, which it isn't here. See Dockerfile header for the rationale.
#
# Environment variables set in the Railway dashboard — see .env.example
# for the full list.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
