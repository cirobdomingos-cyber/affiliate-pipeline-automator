# Railway deploy configuration.
#
# This file describes the DEFAULT service (affiliate-ui = Streamlit).
# The project is meant to have TWO services deployed from the same repo:
#
#   affiliate-ui    default Dockerfile CMD → Streamlit on $PORT
#                   healthcheck: /_stcore/health
#
#   affiliate-api   Custom Start Command override (set in Railway UI):
#                     sh -c "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
#                   healthcheck: /health
#
# Both services share a single Railway Postgres addon via the
# DATABASE_URL env var (Railway injects it automatically when you attach
# the addon and reference it under Variables → Add Reference).
#
# When DATABASE_URL is set, backend/app/db.py switches from DuckDB to
# Postgres via its built-in adapter. No Volume is needed.
#
# Full step-by-step: see DEPLOY.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
