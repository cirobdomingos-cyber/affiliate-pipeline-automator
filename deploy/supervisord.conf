; Supervisord manages three processes inside the container:
;   - uvicorn  (FastAPI on 127.0.0.1:8000)
;   - streamlit (UI on 127.0.0.1:8501)
;   - nginx    (public on $PORT)
;
; Logs go to stdout/stderr so Railway captures them in its dashboard.
; If any of the three exits non-zero, supervisord restarts it up to 3 times.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --no-access-log
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:streamlit]
command=streamlit run ui/streamlit_app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
